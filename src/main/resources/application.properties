# ========================================
# APLICACIÓN
# ========================================
spring.application.name=app_lav

# ========================================
# BASE DE DATOS - MySQL/PostgreSQL
# ========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lavadero}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

# ========================================
# JPA/HIBERNATE
# ========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ========================================
# THYMELEAF
# ========================================
spring.thymeleaf.cache=false
spring.web.resources.cache.period=0

# ========================================
# SERVIDOR
# ========================================
server.address=0.0.0.0
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# ========================================
# CONFIGURACIÓN DE ERRORES
# ========================================
server.error.whitelabel.enabled=false
server.error.include-stacktrace=never
server.error.include-message=never

# ========================================
# EMAIL
# ========================================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=30000
spring.mail.properties.mail.smtp.timeout=30000
spring.mail.properties.mail.smtp.writetimeout=30000
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.debug=false
spring.mail.default-encoding=UTF-8

# ========================================
# RECORDATORIOS
# ========================================
app.recordatorios.enabled=true
app.recordatorios.cron=0 0 9 * * ?

# ========================================
# HORARIOS DEL NEGOCIO
# ========================================
app.horarios.manana.inicio=8
app.horarios.manana.fin=15
#app.horarios.tarde.inicio=17
#app.horarios.tarde.fin=20
app.horarios.sabado.inicio=9
app.horarios.sabado.fin=14
app.horarios.intervalo-minutos=60

# ========================================
# LOGGING
# ========================================
logging.level.root=WARN
logging.level.com.lavaderosepulveda=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.orm.jpa=ERROR
logging.level.org.hibernate=ERROR
logging.level.org.hibernate.orm.query=ERROR

# ========================================
# CORS (configurado en SecurityConfig)
# ========================================
# CORS: orígenes EXACTOS separados por comas (sin "*"). En local añade http://localhost:5173 vía variable de entorno:
#   APP_CORS_ALLOWED_ORIGINS=https://lavadero-sepulveda.vercel.app,http://localhost:5173
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://lavadero-sepulveda.vercel.app,https://www.lavaderosepulveda.es,https://lavadero-sepulveda-production.up.railway.app}

# ========================================
# JWT
# ========================================
jwt.secret=${JWT_SECRET}
# Token corto renovable con actividad (/api/auth/refresh) + duración máxima absoluta de sesión.
# Si el CRM se queda abierto sin usar más de 30 min, la sesión caduca sola.
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:30}
jwt.max-session-hours=${JWT_MAX_SESSION_HOURS:8}

# ─── Rate limiting ───────────────────────────────────────────────────────────
# Cabecera fiable con la IP del cliente (Railway la sobrescribe en su edge; con Cloudflare usar CF-Connecting-IP)
app.security.client-ip-header=${CLIENT_IP_HEADER:X-Real-IP}
# Límites globales de la API (login, reservas y chatbot tienen además límites propios más estrictos)
app.rate-limit.api.anonimo-por-minuto=60
app.rate-limit.api.ip-autenticado-por-minuto=300
app.rate-limit.api.usuario-por-minuto=240
app.rate-limit.api.usuario-por-hora=6000

# ========================================
# JACKSON — serialización de fechas
# ========================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.adjust-dates-to-context-time-zone=false