<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Administración - Lavadero Sepúlveda</title>
  <script>
    (function () {
      'use strict';
      const darkMode = localStorage.getItem('darkMode') === 'true';
      if (darkMode) {
        document.documentElement.classList.add('dark-theme');
      }
      const fontSize = localStorage.getItem('fontSize') || 'medium';
      document.documentElement.classList.add('font-' + fontSize);
      const compactView = localStorage.getItem('compactView') === 'true';
      if (compactView) {
        document.documentElement.classList.add('compact-view');
      }
    })();
  </script>
  <link rel="stylesheet" th:href="@{/css/dark-theme.css}">
  <link rel="stylesheet" th:href="@{/css/login.css}">
  <link rel="icon" type="image/x-icon" th:href="@{/images/favicon.ico?v=2}">
</head>

<body>
  <div class="login-container">
    <div class="login-card">
      <!-- Logo y título -->
      <div class="login-logo">
        <span class="logo-icon">🚗</span>
        <h1>Lavadero Sepúlveda</h1>
        <p>Panel de Administración</p>
      </div>

      <!-- Mensaje de error (si existe) -->
      <div th:if="${param.error}" class="alert alert-danger">
        ❌ Usuario o contraseña incorrectos
      </div>

      <!-- Mensaje de logout (si existe) -->
      <div th:if="${param.logout}" class="alert alert-success">
        ✅ Has cerrado sesión correctamente
      </div>

      <!-- Formulario de login -->
      <form th:action="@{/admin/login}" method="post" class="login-form">
        <!-- Campo de usuario -->
        <div class="form-group">
          <label for="username" class="form-label">Usuario</label>
          <div class="form-input-wrapper">
            <span class="form-input-icon">👤</span>
            <input type="text" id="username" name="username" class="form-control" placeholder="Ingresa tu usuario"
              required autofocus>
          </div>
        </div>

        <!-- Campo de contraseña -->
        <div class="form-group">
          <label for="password" class="form-label">Contraseña</label>
          <div class="form-input-wrapper">
            <span class="form-input-icon">🔒</span>
            <input type="password" id="password" name="password" class="form-control"
              placeholder="Ingresa tu contraseña" required>
          </div>
        </div>

        <br>
        <!-- Recordarme (opcional) -->
        <div class="remember-me">
          <input type="checkbox" id="remember" name="remember-me">
          <label for="remember">Recordarme</label>
        </div>

        <!-- CSRF Token -->
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <!-- Botón de submit -->
        <button type="submit" class="btn-login">
          <span class="btn-login-icon">🔐</span>
          <span>Iniciar Sesión</span>
        </button>
      </form>

      <br>
      <!-- Footer del login (opcional) -->
      <div class="login-footer">
        <a href="/">← Volver a la página principal</a>
      </div>
    </div>

    <br>
    <!-- Versión (opcional) -->
    <div class="login-version">
      Lavadero Sepúlveda v1.0 © 2025
    </div>
  </div>
</body>

</html>
